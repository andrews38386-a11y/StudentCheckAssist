<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Check Assist</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:22px 18px;text-align:center}main{padding:16px;max-width:620px;margin:auto}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0001}button,.btn{border:0;border-radius:12px;padding:13px 15px;background:#4f46e5;color:white;font-weight:700;width:100%;margin:6px 0}input{width:100%;padding:13px;border:1px solid #ccd2df;border-radius:10px;margin:6px 0}h2{margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{min-height:80px}.hidden{display:none}.back{background:#374151}.small{font-size:13px;color:#667085}.item{padding:10px;border-bottom:1px solid #eee}.danger{background:#dc2626}.ok{background:#059669}img{max-width:100%;border-radius:12px}</style></head><body><header><h1>Student Check Assist</h1><div id="user" class="small" style="color:#ddd">All-in-one student assistant</div></header><main>
<section id="login"><div class="card"><h2>Login</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button><button class="back" onclick="show('reg')">Create Account</button><div id="msg"></div></div></section>
<section id="reg" class="hidden"><div class="card"><h2>Register</h2><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><button onclick="sendOtp()">Send OTP</button><input id="ro" placeholder="Enter OTP"><input id="rp" type="password" placeholder="Password"><input id="rc" type="password" placeholder="Confirm Password"><button onclick="register()">Complete Registration</button><button class="back" onclick="show('login')">Back</button><div id="regmsg"></div></div></section>
<section id="dash" class="hidden"><div class="card"><h2>Dashboard</h2><div class="grid"><button onclick="show('perf')">📊 Performance</button><button onclick="show('checks')">✅ Checks</button><button onclick="show('rooms')">🏫 Find Class Rooms & Labs</button><button onclick="show('time')">🗓️ Timetable</button></div><button class="danger" onclick="logout()">Logout</button></div></section>
<section id="perf" class="hidden"><div class="card"><h2>Performance</h2><input id="marks" type="number" placeholder="Enter marks"><input id="total" type="number" placeholder="Total marks"><button onclick="calc()">Calculate</button><p id="score"></p><button class="back" onclick="show('dash')">Back</button></div></section>
<section id="checks" class="hidden"><div class="card"><h2>Checks / Reminders</h2><input id="ct" placeholder="Check title"><input id="cd" type="datetime-local"><button onclick="addCheck()">Add Check & Alarm</button><div id="cl"></div><button class="back" onclick="show('dash')">Back</button></div></section>
<section id="rooms" class="hidden"><div class="card"><h2>Find Class Rooms & Labs</h2><input id="rq" placeholder="Search year / room / lab" oninput="rooms()"><div id="rl"></div><img src="classroom_allocation.jpg"><button class="back" onclick="show('dash')">Back</button></div></section>
<section id="time" class="hidden"><div class="card"><h2>Timetable</h2><input type="file" accept="image/*" onchange="preview(this)"><div id="tp"></div><button class="back" onclick="show('dash')">Back</button></div></section>
</main><script>
const R=[['I ECE','AX 101','First','Class Room'],['II ECE','AX 102','First','Class Room'],['III ECE','AX 103','First','Class Room'],['III CSE A','AX 104','First','Class Room'],['I CSE A','AX 201','Second','Class Room'],['I CSE B','AX 202','Second','Class Room'],['II CSE A','AX 203','Second','Class Room'],['II CSE B','AX 204','Second','Class Room'],['I IT & AGRI','AX 301','Third','Class Room'],['II IT','AX 302','Third','Class Room'],['III IT','AX 303','Third','Class Room'],['III CSE B','AX 304','Third','Class Room'],['I AI & DS','AX 401','Fourth','Class Room'],['II AI & DS','AX 402','Fourth','Class Room'],['III AI & DS','AX 403','Fourth','Class Room'],['I MECH & EEE','AX 404','Fourth','Class Room'],['I BME','AX 501','Fifth','Class Room'],['II BME','AX 502','Fifth','Class Room'],['III BME','AX 503','Fifth','Class Room'],['I MBA','LB 1','Lab Block','Lab'],['II MBA','LB 2','Lab Block','Lab'],['II EEE','LB 3','Lab Block','Lab'],['III EEE','LB 4','Lab Block','Lab'],['II AGRI','LB 5','Lab Block','Lab'],['III AGRI','LB 6','Lab Block','Lab'],['II MECH','MECH LAB 1','Lab Block','Lab'],['III MECH','MECH LAB 2','Lab Block','Lab']];
function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='checks')listChecks();if(id==='rooms')rooms()}
function users(){return JSON.parse(localStorage.users||'[]')} function setmsg(id,t){document.getElementById(id).innerHTML='<p>'+t+'</p>'}
function sendOtp(){if(!rn.value||!re.value)return setmsg('regmsg','Enter name and email');let o=('000000'+Math.floor(Math.random()*1000000)).slice(-6);localStorage.pending=JSON.stringify({n:rn.value,e:re.value,o:o,exp:Date.now()+600000});setmsg('regmsg','Demo OTP: <b>'+o+'</b> (10 minutes). For real email OTP, connect an email/backend service.')} 
function register(){let p=JSON.parse(localStorage.pending||'null');if(!p||Date.now()>p.exp||ro.value!==p.o)return setmsg('regmsg','Invalid or expired OTP');if(!rp.value||rp.value!==rc.value||rp.value.length<6)return setmsg('regmsg','Password must be 6+ characters and match');let u=users();if(u.some(x=>x.e===p.e))return setmsg('regmsg','Email already registered');u.push({n:p.n,e:p.e,p:rp.value});localStorage.users=JSON.stringify(u);localStorage.removeItem('pending');setmsg('regmsg','Registration complete. Login now.');setTimeout(()=>show('login'),700)}
function login(){let u=users().find(x=>x.e===le.value&&x.p===lp.value);if(!u)return setmsg('msg','Invalid email or password');localStorage.current=u.e;user.innerText='Welcome, '+u.n;show('dash')}
function logout(){localStorage.removeItem('current');show('login')}
function calc(){let a=+marks.value,b=+total.value;if(!b)return score.innerText='Enter valid total marks';score.innerText='Percentage: '+(a/b*100).toFixed(2)+'%'}
function addCheck(){if(!ct.value||!cd.value)return;let a=JSON.parse(localStorage.checks||'[]');let x={id:Date.now(),t:ct.value,d:cd.value,done:false};a.push(x);localStorage.checks=JSON.stringify(a);if(window.Android)Android.schedule(x.t,new Date(x.d).getTime());ct.value='';cd.value='';listChecks()}
function listChecks(){let a=JSON.parse(localStorage.checks||'[]');cl.innerHTML=a.map(x=>'<div class="item">'+x.t+'<br><span class="small">'+new Date(x.d).toLocaleString()+'</span> <button class="ok" onclick="done('+x.id+')">Done</button></div>').join('')||'<p class="small">No checks yet.</p>'}function done(id){let a=JSON.parse(localStorage.checks||'[]').filter(x=>x.id!==id);localStorage.checks=JSON.stringify(a);listChecks()}
function rooms(){let q=(rq.value||'').toLowerCase();rl.innerHTML=R.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>'<div class="item"><b>'+x[1]+'</b> — '+x[0]+'<br>'+x[2]+' • '+x[3]+'</div>').join('')}
function preview(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{localStorage.timetable=e.target.result;tp.innerHTML='<img src="'+e.target.result+'">';};r.readAsDataURL(f)}
if(localStorage.current){let u=users().find(x=>x.e===localStorage.current);if(u){user.innerText='Welcome, '+u.n;show('dash')}} else show('login');
</script></body></html>
